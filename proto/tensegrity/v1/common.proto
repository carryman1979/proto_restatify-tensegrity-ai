syntax = "proto3";

package tensegrity.v1.common;

option csharp_namespace = "Tensegrity.V1.Common";

import "google/protobuf/timestamp.proto";

enum ConfidentialityLevel {
  CONFIDENTIALITY_LEVEL_UNSPECIFIED = 0;
  OFFEN = 1;
  VERTRAULICH = 2;
  STRENG_GEHEIM = 3;
  NUR_LOKAL = 4;
}

message DeviceInfo {
  string app_instance_id = 1;
  string device_id = 2;
  string platform = 3;
  string build_version = 4;
  string locale = 5;
}

message EvidenceRef {
  string source_id = 1;
  string citation = 2;
  google.protobuf.Timestamp observed_at = 3;
}

message TraceContext {
  string request_id = 1;
  string session_id = 2;
  string app_instance_id = 3;
  google.protobuf.Timestamp created_at = 4;
}
