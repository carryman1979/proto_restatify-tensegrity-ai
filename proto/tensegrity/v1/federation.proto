syntax = "proto3";

package tensegrity.v1.federation;

option csharp_namespace = "Tensegrity.V1.Federation";

import "tensegrity/v1/common.proto";

message DeltaSubmission {
  string submission_id = 1;
  string device_id = 2;
  string app_instance_id = 3;
  string slot_id = 4;
  string category = 5;
  bytes compressed_delta = 6;
  bytes structure_message = 7;
  int64 privacy_round = 8;
  tensegrity.v1.common.ConfidentialityLevel level = 9;
  string signature = 10;
}

message SubmissionAck {
  string submission_id = 1;
  bool accepted = 2;
  string status = 3;
}

service FederationService {
  rpc SubmitDelta(DeltaSubmission) returns (SubmissionAck);
}
